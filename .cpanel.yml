---
deployment:
  tasks:
    - bash -lc 'DEPLOY_DIR="$HOME/public_html"; echo "Deploying to $DEPLOY_DIR"; mkdir -p "$DEPLOY_DIR"; if command -v rsync >/dev/null 2>&1; then rsync -av --delete --exclude=.git --exclude=.cpanel.yml ./ "$DEPLOY_DIR/"; else echo "rsync not found, using tar fallback"; tar -cf /tmp/deploy.tar --exclude=.git --exclude=.cpanel.yml .; tar -xf /tmp/deploy.tar -C "$DEPLOY_DIR"; rm -f /tmp/deploy.tar; fi; echo "Deployment complete"'
